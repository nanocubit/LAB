name: Immutability check
on: [pull_request]
permissions:
  contents: read
jobs:
  immutable-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reject receipt rewrites and decision rewrites
        run: |
          base="origin/${{ github.base_ref }}"
          git diff --name-status "$base"...HEAD | tee /tmp/diff
          if awk '$1 ~ /^[MD]/ && ($2 ~ /^artifacts\/receipts\// || $2 ~ /\/runs\/.*\/receipt/){exit 0} END{exit 1}' /tmp/diff; then
            echo "immutable receipt rewrite or deletion detected"; exit 1
          fi
          if git diff --unified=0 "$base"...HEAD -- DECISIONS.md | grep -E '^-([^ -]|$)'; then
            echo "DECISIONS.md is append-only"; exit 1
          fi
