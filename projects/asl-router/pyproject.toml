[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="asl-router"
version="0.1.0"
requires-python=">=3.11"
dependencies=["blake3>=0.4"]

[project.optional-dependencies]
dev=["pytest>=8"]

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
