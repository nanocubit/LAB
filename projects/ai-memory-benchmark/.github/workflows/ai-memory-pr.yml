name: AI Memory Benchmark CI

on:
  push:
    paths:
      - "projects/ai-memory-benchmark/**"
      - ".github/workflows/ai-memory-pr.yml"
  pull_request:
    paths:
      - "projects/ai-memory-benchmark/**"
      - ".github/workflows/ai-memory-pr.yml"

permissions:
  contents: read

jobs:
  validate-and-test:
    name: validate-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-memory-benchmark

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/ai-memory-benchmark/pyproject.toml

      - name: Install benchmark and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate tiny-world fixture
        run: python reference/validator/validate_tiny_world.py

      - name: Run semantic tests
        run: python -m pytest
