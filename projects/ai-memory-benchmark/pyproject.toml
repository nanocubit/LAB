[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-benchmark"
version = "0.1.0"
description = "Database-agnostic reproducible benchmark for event-sourced AI-agent memory"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private" }
authors = [{ name = "nanocubit" }]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["reference/tests", "generator/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools]
packages = []
